<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pulau Bahasa Jawa · 觸摸問答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  :root{
    --ink:#182444;
    --ink-2:#0f1830;
    --gold:#E7B23D;
    --terracotta:#C1442B;
    --teal:#2C9C8F;
    --cream:#F6EEDD;
    --cream-dim:rgba(246,238,221,0.62);
    --good:#4FAE7B;
    --bad:#C1442B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
    background:var(--ink); color:var(--cream);
    font-family:'Noto Sans TC','Fredoka',sans-serif;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}
  .batik-strip{width:100%; height:26px; flex:0 0 auto;}
  .batik-strip svg{width:100%; height:100%; display:block;}

  #stage{
    position:relative; flex:1 1 auto; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:3vh 6vw; text-align:center;
    min-height:0;
  }
  .eyebrow{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:clamp(11px,2vw,13px);
    letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); margin:0 0 0.8rem;
  }
  #mascot{width:clamp(90px,16vw,140px); height:auto; margin-bottom:0.6rem; flex:0 0 auto; display:block;}
  @keyframes bob{ 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-5px) scale(1.02);} }
  #mascot.talking{ animation: bob .55s ease-in-out infinite; }
  @media (prefers-reduced-motion:reduce){ #mascot.talking{ animation:none; } }

  #body-diagram{width:clamp(110px,20vw,160px); height:auto; margin:0.4rem 0 1rem;}
  .body-part{fill:rgba(246,238,221,0.06); stroke:var(--cream-dim); stroke-width:2.5; transition:stroke .25s, fill .25s, filter .25s;}
  .body-part.target{
    stroke:var(--gold); fill:rgba(231,178,61,0.22);
    filter:drop-shadow(0 0 7px rgba(231,178,61,0.75));
    animation:partpulse 1s ease-in-out infinite;
  }
  @keyframes partpulse{ 0%,100%{ stroke-width:2.5; } 50%{ stroke-width:4; } }
  @media (prefers-reduced-motion:reduce){ .body-part.target{ animation:none; } }
  .body-part.step-ok{
    stroke:var(--good); fill:rgba(79,174,123,0.28);
    filter:drop-shadow(0 0 8px rgba(79,174,123,0.8));
    animation:none;
  }
  #step-hint{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:clamp(11px,2vw,13px);
    color:var(--good); margin:0.3rem 0 0; min-height:1.4em; letter-spacing:0.02em;
  }

  #cue-indo{
    font-family:'Fredoka',sans-serif; font-weight:600;
    font-size:clamp(20px,4.2vw,34px); line-height:1.3; margin:0; max-width:42vw;
  }
  #cue-zh{
    font-family:'Noto Sans TC',sans-serif; font-weight:400;
    font-size:clamp(14px,2.2vw,18px); color:var(--cream-dim); margin:0.4rem 0 0; max-width:36vw; line-height:1.5;
  }

  #hud{
    position:absolute; top:10px; left:0; right:0; z-index:6;
    display:flex; align-items:center; justify-content:space-between; padding:0 12px;
  }
  #gear-btn, #mute-btn{
    width:36px; height:36px; border-radius:50%; border:1.5px solid rgba(246,238,221,0.35);
    background:rgba(15,24,48,0.55); color:var(--cream); display:flex; align-items:center;
    justify-content:center; cursor:pointer; font-size:16px;
  }
  #mute-btn.muted{ opacity:0.5; }
  #score-badge{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:clamp(12px,2.2vw,15px);
    color:var(--ink-2); background:var(--gold); padding:6px 14px; border-radius:999px;
  }
  .ctrl-bar{
    position:absolute; left:0; right:0; bottom:16px; z-index:5;
    display:flex; justify-content:center; gap:8px; pointer-events:none;
  }
  .dot{width:8px; height:8px; border-radius:50%; background:rgba(246,238,221,0.28); transition:background .2s, transform .2s;}
  .dot.active{background:var(--gold); transform:scale(1.25);}
  .dot.done-right{background:var(--good);}
  .dot.done-wrong{background:var(--bad);}

  #feedback{
    position:absolute; inset:0; z-index:9; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; pointer-events:none;
    opacity:0; transition:opacity .18s;
  }
  #feedback.show{ opacity:1; }
  #feedback .mark{ font-size:clamp(64px,14vw,110px); line-height:1; }
  #feedback .msg{
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:clamp(16px,3vw,24px);
    background:rgba(15,24,48,0.85); padding:8px 20px; border-radius:12px;
  }
  #feedback.right .msg{ color:var(--good); }
  #feedback.wrong .msg{ color:var(--bad); }

  /* --- overlay 共用（連線面板 / 開場 / 結算） --- */
  .overlay{
    position:fixed; inset:0; z-index:10; background:var(--ink-2);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:6vw; overflow-y:auto;
  }
  .overlay h1{
    font-family:'Fredoka',sans-serif; font-weight:700; color:var(--gold);
    font-size:clamp(22px,5.4vw,38px); margin:0 0 0.4rem;
  }
  .overlay p{color:var(--cream-dim); font-size:clamp(13px,2.4vw,16px); margin:0.2rem 0;}
  .overlay .btn{
    margin-top:1.6rem; font-family:'Fredoka',sans-serif; font-weight:600;
    color:var(--ink-2); background:var(--gold); padding:0.85rem 2.1rem;
    border-radius:999px; font-size:clamp(14px,2.4vw,17px); border:none; cursor:pointer;
  }
  .overlay .btn:disabled{ background:rgba(231,178,61,0.35); cursor:not-allowed; }
  .overlay .btn.ghost{
    background:transparent; color:var(--gold); border:1.5px solid var(--gold);
  }
  #mqtt-url, #mqtt-user, #mqtt-pass{
    width:min(86vw,420px); font-size:14px; padding:0.7rem 0.9rem; border-radius:10px;
    border:1.5px solid rgba(246,238,221,0.3); background:rgba(246,238,221,0.06);
    color:var(--cream); font-family:'Noto Sans TC',sans-serif;
  }
  #mqtt-url{ margin-top:1.4rem; }
  #mqtt-url::placeholder, #mqtt-user::placeholder, #mqtt-pass::placeholder{ color:rgba(246,238,221,0.4); }
  #conn-status{
    margin-top:0.7rem; font-size:13px; font-weight:600; min-height:1.4em;
  }
  #conn-status.ok{ color:var(--teal); }
  #conn-status.err{ color:var(--terracotta); }
  #conn-status.pending{ color:var(--gold); }

  #result-score{
    font-family:'Fredoka',sans-serif; font-weight:700; color:var(--cream);
    font-size:clamp(36px,9vw,64px); margin:0.6rem 0;
  }
  #result-score span{ color:var(--gold); }
</style>
</head>
<body>
<div id="app">
  <div class="batik-strip" id="strip-top"></div>

  <div id="stage">
    <div id="hud">
      <div id="gear-btn" aria-label="連線設定" title="連線設定">⚙</div>
      <div style="display:flex; align-items:center; gap:8px;">
        <div id="mute-btn" aria-label="靜音切換" title="靜音切換">🔊</div>
        <div id="score-badge">0 分</div>
      </div>
    </div>

    <p class="eyebrow">Kebbi bertanya</p>
    <img id="mascot" src="images/mascot.png" alt="科摩多巨蜥吉祥物">

    <svg id="body-diagram" viewBox="0 0 120 170" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle id="part-head" class="body-part" cx="60" cy="30" r="20"/>
      <path id="part-chest" class="body-part" d="M40 62 h40 a10 10 0 0 1 10 10 v40 a10 10 0 0 1 -10 10 h-40 a10 10 0 0 1 -10 -10 v-40 a10 10 0 0 1 10 -10 z"/>
      <path id="part-left" class="body-part" d="M40 68 L14 90 a9 9 0 0 0 12 13 l20 -18"/>
      <path id="part-right" class="body-part" d="M80 68 L106 90 a9 9 0 0 1 -12 13 l-20 -18"/>
    </svg>

    <p id="cue-indo">…</p>
    <p id="cue-zh">…</p>
    <p id="step-hint"></p>

    <div id="feedback">
      <div class="mark"></div>
      <div class="msg"></div>
    </div>
  </div>

  <div class="ctrl-bar" id="dots"></div>

  <div class="batik-strip" id="strip-bottom"></div>

  <!-- 連線面板 / 開場畫面 -->
  <div class="overlay" id="start-overlay">
    <h1>Pulau Bahasa Jawa</h1>
    <p>觸摸問答 · Kuis Sentuh Tubuh</p>
    <p style="margin-top:0.6rem;">凱比會用印尼語出題，摸摸身體正確的部位就能得分！</p>
    <input id="mqtt-url" type="text" placeholder="MQTT 網址（區網 ws://、ngrok wss://，或 HiveMQ wss://...:8884/mqtt）" autocomplete="off" autocapitalize="off" spellcheck="false">
    <input id="mqtt-user" type="text" placeholder="帳號（本機/ngrok 不用填，HiveMQ 才需要）" autocomplete="off" autocapitalize="off" spellcheck="false" style="margin-top:0.6rem;">
    <input id="mqtt-pass" type="password" placeholder="密碼（本機/ngrok 不用填，HiveMQ 才需要）" autocomplete="off" autocapitalize="off" spellcheck="false" style="margin-top:0.6rem;">
    <div id="conn-status"></div>
    <button class="btn" id="btn-connect">建立連線 · Sambungkan</button>
    <label id="adv-toggle-wrap" style="display:flex; align-items:center; gap:8px; margin-top:1.2rem; font-size:13px; color:var(--cream-dim); cursor:pointer;">
      <input type="checkbox" id="adv-toggle" style="width:18px; height:18px; accent-color:var(--gold);">
      進階模式：連續指令（例如先摸頭、再摸右手）
    </label>
    <button class="btn" id="btn-start" style="display:none;">開始遊戲 · Mulai!</button>
  </div>

  <!-- 結算畫面 -->
  <div class="overlay" id="result-overlay" style="display:none;">
    <h1 id="result-title">Selesai!</h1>
    <p id="result-sub">遊戲結束</p>
    <div id="result-score">0<span> / 0</span></div>
    <p id="result-msg"></p>
    <button class="btn" id="btn-again">再玩一次 · Main lagi</button>
    <button class="btn ghost" id="btn-reconnect-from-result">連線設定</button>
  </div>
</div>

<script>

  // ---------------------------------------------------------------------
  // 題庫設定：比賽現場建議 5-6 題，這裡先設 6，可依需求調整
  // ---------------------------------------------------------------------

  var TOPIC = 'kebbi/touch';

  function playDataUri(uri){
    try{
      var a = new Audio(uri);
      a.play().catch(function(){});
    }catch(e){}
  }

  function unlockAudio(){
    // 在使用者真的點擊「開始遊戲」當下，用極短靜音播放解鎖 Safari 的自動播放限制，
    // 之後即使是非同步（例如 MQTT 訊息觸發）的播放也不會被擋
    try{
      var a = new Audio(SOUND_URIS.correct);
      a.volume = 0;
      a.play().then(function(){ a.pause(); a.currentTime = 0; }).catch(function(){});
    }catch(e){}
  }

  function playCorrectSound(){
    if (muted) return;
    playDataUri(SOUND_URIS.correct);
  }

  function playWrongSound(){
    if (muted) return;
    playDataUri(SOUND_URIS.wrong);
  }

  function playFinishSound(ratio){
    if (muted) return;
    var uri = ratio === 1 ? SOUND_URIS.finishPerfect : (ratio >= 0.6 ? SOUND_URIS.finishGood : SOUND_URIS.finishTryAgain);
    playDataUri(uri);
  }

  function speak(text, lang){
    if (muted) return;
    if (!('speechSynthesis' in window)) return;
    try{
      window.speechSynthesis.cancel();
      var utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang || 'id-ID';
      utter.rate = 0.9;
      window.speechSynthesis.speak(utter);
    }catch(e){}
  }

      '<circle cx="8" cy="13" r="6" fill="none" stroke="'+colorA+'" stroke-width="1.4" opacity="0.55"/>'+
      '<circle cx="24" cy="13" r="6" fill="none" stroke="'+colorB+'" stroke-width="1.4" opacity="0.55"/>'+
      '<circle cx="16" cy="4" r="3" fill="'+colorA+'" opacity="0.35"/>'+
      '<circle cx="16" cy="22" r="3" fill="'+colorB+'" opacity="0.35"/>'+
      '</pattern></defs>'+
      '<rect width="64" height="26" fill="url(#'+id+')"/>'+
      '</svg>';
  }
  document.getElementById('strip-top').innerHTML = batikPattern('kq1','#E7B23D','#C1442B');

  // ---------------------------------------------------------------------
  // MQTT 連線
  // ---------------------------------------------------------------------
  var client = null;
  var isConnected = false;

  var savedUrl = localStorage.getItem(STORAGE_KEY);
  var savedUser = localStorage.getItem(STORAGE_KEY_USER);
  var savedPass = localStorage.getItem(STORAGE_KEY_PASS);
  if (savedUrl) urlInput.value = savedUrl;
  if (savedUser) userInput.value = savedUser;
  if (savedPass) passInput.value = savedPass;

  function setConnStatus(text, cls){
    connStatus.textContent = text;
    connStatus.className = cls || '';
  }

  function connectMqtt(url, username, password){
    if (!url){
      setConnStatus('請先貼上 MQTT 網址', 'err');
      return;
    }
    if (client){
      try{ client.end(true); }catch(e){}
      client = null;
    }
    isConnected = false;
    btnStart.style.display = 'none';
    setConnStatus('連線中…', 'pending');

    var clientId = 'kebbiquiz-' + Math.random().toString(16).slice(2, 10);
    var opts = { clientId: clientId, reconnectPeriod: 3000, connectTimeout: 8000 };
    if (username) opts.username = username;
    if (password) opts.password = password;
    try{
      client = mqtt.connect(url, opts);
    }catch(e){
      setConnStatus('網址格式錯誤，請確認開頭是 ws:// 或 wss://', 'err');
      return;
    }

    client.on('connect', function(){
      isConnected = true;
      localStorage.setItem(STORAGE_KEY, url);
      if (username) localStorage.setItem(STORAGE_KEY_USER, username);
      if (password) localStorage.setItem(STORAGE_KEY_PASS, password);
      setConnStatus('已連線 ✅', 'ok');
      btnStart.style.display = 'inline-block';
      client.subscribe(TOPIC, function(err){
        if (err) setConnStatus('已連線，但訂閱失敗：' + err.message, 'err');
      });
    });

    client.on('reconnect', function(){
      setConnStatus('連線中斷，正在重試…', 'pending');
    });

    client.on('close', function(){
      if (isConnected){ setConnStatus('已斷線，正在重試…', 'pending'); }
    });

    client.on('error', function(err){
      isConnected = false;
      setConnStatus('連線失敗，請確認網址正確（區網要同一個 Wi-Fi，或 ngrok 網址是否過期）', 'err');
    });

    client.on('message', function(topic, payloadBuffer){
      if (topic !== TOPIC) return;
      var part = payloadBuffer.toString().trim();
      handleTouch(part);
    });
  }

  // 凱比那邊送出觸摸訊號後，要切換到「監聽 kebbi/action」這個節點需要一點處理時間
  // （連線到 NUWA 雲端、重新訂閱）。網頁這邊判斷幾乎是瞬間完成，如果立刻發送，
  // 凱比很可能還沒開始監聽，訊息就直接消失收不到。故意延遲一下，讓凱比先準備好。
  var ACTION_PUBLISH_DELAY_MS = 1510;

  function publishAction(action){
    setTimeout(function(){
      if (!isConnected || !client) return;
      client.publish(TOPIC_ACTION, action);
    }, ACTION_PUBLISH_DELAY_MS);
  }

  btnConnect.addEventListener('click', function(){
    connectMqtt(urlInput.value.trim(), userInput.value.trim(), passInput.value);
  });

  gearBtn.addEventListener('click', function(){
    startOverlay.style.display = 'flex';
  });

  btnReconnectFromResult.addEventListener('click', function(){
    resultOverlay.style.display = 'none';
    startOverlay.style.display = 'flex';
  });

  // ---------------------------------------------------------------------
  // 遊戲狀態機
  // ---------------------------------------------------------------------
  var order = [];       // 本局題目順序：每題是 1 個（一般模式）或 2 個（進階模式）body part key 的陣列
  var qIndex = 0;
  var stepIndex = 0;    // 目前題目走到第幾步（進階模式才會用到 0/1）
  var score = 0;
  var state = 'idle';   // idle | playing | locked | finished
  var ADVANCED = false;
  var lockTimer = null;

  function randomPart(exclude){
    var pick;
    do {
      pick = PART_KEYS[Math.floor(Math.random() * PART_KEYS.length)];
    } while (pick === exclude && PART_KEYS.length > 1);
    return pick;
  }

  function shuffleQuestions(){
    var arr = [];
    var lastPick = null;
    for (var i = 0; i < QUESTION_COUNT; i++){
      if (ADVANCED){
        var a = randomPart(lastPick);
        var b = randomPart(a);
        arr.push([a, b]);
        lastPick = b;
      } else {
        var pick = randomPart(lastPick);
        lastPick = pick;
        arr.push([pick]);
      }
    }
    return arr;
  }

  function buildDots(){
    dotsEl.innerHTML = '';
    for (var i = 0; i < QUESTION_COUNT; i++){
      var d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.id = 'dot-' + i;
      dotsEl.appendChild(d);
    }
  }

  function setTargetDiagram(part){
    PART_KEYS.forEach(function(k){
      document.getElementById(PART_TO_DIAGRAM[k]).classList.remove('target');
    });
    document.getElementById(PART_TO_DIAGRAM[part]).classList.add('target');
  }

  function renderQuestion(){
    var steps = order[qIndex];
    stepIndex = 0;
    if (steps.length === 2){
      var a = PARTS[steps[0]], b = PARTS[steps[1]];
      cueIndo.textContent = 'Sentuh ' + a.word + ', lalu sentuh ' + b.word + '!';
      cueZh.textContent = '先摸你的' + a.name + '，再摸你的' + b.name + '！';
      stepHint.textContent = '第 1 步：' + a.name;
    } else {
      var info = PARTS[steps[0]];
      cueIndo.textContent = info.cue;
      cueZh.textContent = info.zh;
      stepHint.textContent = '';
    }
    setTargetDiagram(steps[0]);
    scoreBadge.textContent = score + ' 分';
    feedbackEl.classList.remove('show', 'right', 'wrong');
    mascot.classList.add('talking');
    speak(cueIndo.textContent);
  }

  function startGame(){
    unlockAudio();
    ADVANCED = advToggle.checked;
    order = shuffleQuestions();
    qIndex = 0;
    score = 0;
    state = 'playing';
    buildDots();
    resultOverlay.style.display = 'none';
    startOverlay.style.display = 'none';
    renderQuestion();
  }

  btnStart.addEventListener('click', function(){
    if (!isConnected){
      setConnStatus('請先完成連線再開始', 'err');
      return;
    }
    startGame();
  });

  btnAgain.addEventListener('click', function(){
    startGame();
  });

  function markDot(i, correct){
    var d = document.getElementById('dot-' + i);
    if (!d) return;
    d.classList.remove('active');
    d.classList.add(correct ? 'done-right' : 'done-wrong');
  }

  function activateDot(i){
    var d = document.getElementById('dot-' + i);
    if (d) d.classList.add('active');
  }

  function settleQuestion(correct, wrongPart, expectedPart){
    state = 'locked';
    mascot.classList.remove('talking');
    stepHint.textContent = '';

    if (correct){
      score++;
      scoreBadge.textContent = score + ' 分';
      feedbackMark.textContent = '✅';
      feedbackMsg.textContent = 'Benar! 答對了！';
      feedbackEl.classList.add('show', 'right');
      playCorrectSound();
      publishAction('clap');
    } else {
      feedbackMark.textContent = '❌';
      feedbackMsg.textContent = '摸到了「' + PARTS[wrongPart].name + '」，答案是「' + PARTS[expectedPart].name + '」';
      feedbackEl.classList.add('show', 'wrong');
      playWrongSound();
      publishAction('wrong');
    }
    markDot(qIndex, correct);

    clearTimeout(lockTimer);
    lockTimer = setTimeout(function(){
      qIndex++;
      if (qIndex >= QUESTION_COUNT){
        finishGame();
      } else {
        activateDot(qIndex);
        state = 'playing';
        renderQuestion();
      }
    }, 1500);
  }

  function handleTouch(part){
    if (state !== 'playing') return;
    if (PART_KEYS.indexOf(part) === -1) return; // 忽略未知字串

    var steps = order[qIndex];
    var expected = steps[stepIndex];

    if (part !== expected){
      settleQuestion(false, part, expected);
      return;
    }

    stepIndex++;
    if (stepIndex >= steps.length){
      settleQuestion(true);
      return;
    }

    // 進階模式答對第一步：短暫綠色回饋，接著切換到第二步目標，不鎖定畫面
    var doneEl = document.getElementById(PART_TO_DIAGRAM[expected]);
    doneEl.classList.remove('target');
    doneEl.classList.add('step-ok');
    setTimeout(function(){ doneEl.classList.remove('step-ok'); }, 500);

    var nextPart = steps[stepIndex];
    setTargetDiagram(nextPart);
    stepHint.textContent = '第 2 步：' + PARTS[nextPart].name;
  }

  function finishGame(){
    state = 'finished';
    mascot.classList.remove('talking');
    resultScoreEl.innerHTML = score + '<span> / ' + QUESTION_COUNT + '</span>';
    var ratio = score / QUESTION_COUNT;
    var msg;
    if (ratio === 1) msg = 'Sempurna! 全部答對，太厲害了！';
    else if (ratio >= 0.6) msg = 'Bagus sekali! 表現很棒！';
    else msg = 'Ayo coba lagi! 再玩一次會更好！';
    resultMsgEl.textContent = msg;
    resultOverlay.style.display = 'flex';
    playFinishSound(ratio);
  }

  // 頁面載入時：優先嘗試讀 ngrok-url.json（本機跑 update-ngrok-url.sh 產生的最新網址），
  // 抓不到（例如不同裝置開、或還沒跑腳本）就退回使用者上次記住的網址
  function tryAutoFillFromNgrokJson(){
    fetch('ngrok-url.json?t=' + Date.now())
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(data){
        if (data && data.wss_url){
          urlInput.value = data.wss_url;
          setConnStatus('已自動帶入連線設定', 'ok');
          connectMqtt(data.wss_url, savedUser, savedPass);
        } else if (savedUrl){
          connectMqtt(savedUrl, savedUser, savedPass);
        }
      })
      .catch(function(){
        if (savedUrl) connectMqtt(savedUrl, savedUser, savedPass);
      });
  }
  tryAutoFillFromNgrokJson();
})();
</script>
</body>
</html>
